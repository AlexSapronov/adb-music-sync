name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Syntax / import check
        run: python -m compileall -q src

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Smoke import test
        run: python -c "import adb_music_sync.adb, adb_music_sync.storage, adb_music_sync.scanner, adb_music_sync.transfer, adb_music_sync.controller, adb_music_sync.models, adb_music_sync.errors, adb_music_sync.paths; print('imports ok')"

      - name: Run tests with coverage (exclude device)
        run: pytest -m "not device" --cov=adb_music_sync --cov-report=term-missing --cov-report=xml

      - name: Windows build
        shell: powershell
        run: |
          # put a bogus adb under platform-tools so the build does not find a real one
          New-Item -ItemType Directory -Force -Path platform-tools | Out-Null
          python -m PyInstaller --noconfirm --clean --name adb-music-sync --onefile --windowed --collect-all PySide6 --paths src src\adb_music_sync\__main__.py

      - name: Verify exe exists
        shell: powershell
        run: |
          if (-not (Test-Path dist\adb-music-sync.exe)) { throw "exe not produced" }

      - name: Frozen smoke test
        shell: powershell
        run: |
          $p = Start-Process -FilePath dist\adb-music-sync.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-music-sync-0.1.3-windows
          path: dist/adb-music-sync.exe